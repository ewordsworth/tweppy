<!-- Edit Tweet Modal (shared by the profile and community queues) -->
<div id="edit-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
  <div class="modal-content">
    <button type="button" class="close-button js-close-modal" aria-label="Close">&times;</button>
    <h2 id="edit-modal-title">Edit Tweet</h2>
    <form id="edit-form" method="POST" class="stacked-form">
      <textarea id="edit-tweet-text" name="new_text" rows="5" required data-preview="edit-preview" data-single="1"></textarea>
      <div id="edit-preview" class="tweet-preview"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary js-close-modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<!-- Schedule Modal -->
<div id="schedule-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="schedule-modal-title">
  <div class="modal-content">
    <button type="button" class="close-button js-close-modal" aria-label="Close">&times;</button>
    <h2 id="schedule-modal-title">Schedule Tweet</h2>
    <form id="schedule-form" action="{{ url_for('schedule') }}" method="POST" class="stacked-form js-utc-form">
      <label for="schedule-text">Tweet</label>
      <textarea id="schedule-text" name="scheduled_text" rows="4" placeholder="Your tweet" required data-preview="schedule-preview" data-single="1"></textarea>
      <div id="schedule-preview" class="tweet-preview"></div>
      <label for="schedule-datetime">Post at</label>
      <input id="schedule-datetime" name="scheduled_at" type="datetime-local" required data-utc-target="schedule-datetime-utc" />
      <input type="hidden" id="schedule-datetime-utc" name="scheduled_at_utc" />
      <div class="form-actions">
        <button type="button" class="btn btn-secondary js-close-modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Schedule</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Scheduled Modal -->
<div id="edit-scheduled-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-scheduled-title">
  <div class="modal-content">
    <button type="button" class="close-button js-close-modal" aria-label="Close">&times;</button>
    <h2 id="edit-scheduled-title">Edit Scheduled Tweet</h2>
    <form id="edit-scheduled-form" method="POST" class="stacked-form js-utc-form">
      <label for="edit-scheduled-text">Tweet</label>
      <textarea id="edit-scheduled-text" name="scheduled_text" rows="4" required data-preview="edit-scheduled-preview" data-single="1"></textarea>
      <div id="edit-scheduled-preview" class="tweet-preview"></div>
      <label for="edit-scheduled-datetime">Post at</label>
      <input id="edit-scheduled-datetime" name="scheduled_at" type="datetime-local" required data-utc-target="edit-scheduled-datetime-utc" />
      <input type="hidden" id="edit-scheduled-datetime-utc" name="scheduled_at_utc" />
      <div class="form-actions">
        <button type="button" class="btn btn-secondary js-close-modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
